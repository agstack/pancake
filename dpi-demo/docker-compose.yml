# PnD DPI OpenScience demo stack.
# Profiles:
#   core        - postgres + pancake grants + pancake TAP worker + agstack-pnd (all from repos we control)
#   registry    - AR2 hub + AR2 node (external repos agstack/ar2-hub, agstack/ar2 at tag v0.9-review)
#   openscience - terrapipe-os node: deforestation screen, NDVI, GFS forecast over mirrored public data
# Run:  docker compose --profile core --profile registry up --build
#       docker compose --profile core --profile registry --profile openscience up --build
#
# The openscience profile is separate because it is the only one that needs
# data mounted from outside the repositories. Without the mirrored rasters the
# node starts and answers honestly -- every layer reports `not_mirrored` rather
# than zero -- so bringing it up with an empty share is a valid way to see the
# shape of the answer before the data lands.
name: pnd-dpi-demo

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: pancake
      POSTGRES_USER: pancake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pancake-dev-only}
    ports:
      - "5433:5432"
    volumes:
      - pnd_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pancake"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub:
    profiles: ["registry"]
    build:
      context: ../../ar2-hub
      dockerfile: ../pancake/dpi-demo/hub.Dockerfile
    environment:
      DATABASE_URL: ${HUB_DATABASE_URL:-sqlite:////data/hub.db}
      WORLD_SHP_FILE: ${WORLD_SHP_FILE:-/app/world.shp}
      REGISTRY_SERVERS: ${REGISTRY_SERVERS:-[]}
    ports:
      - "8000:8000"
    command: ["uvicorn", "hub_main:app", "--host", "0.0.0.0", "--port", "8000"]

  node:
    profiles: ["registry"]
    build:
      context: ../../ar2
      dockerfile: ../pancake/dpi-demo/node.Dockerfile
    depends_on:
      - hub
    environment:
      JWKS_URL: ${HUB_JWKS_URL:-http://hub:8000/.well-known/jwks.json}
      AR_TRUSTED_ISSUER_PUBKEY: /run/secrets/issuer_pub.pem
      # Must equal the value on pancake-grants. AR2 guards artifact reads with
      # it, and Pancake reads a list artifact in order to issue the first grant
      # for that list, so it has no grant to present and must be trusted by
      # name. Unset on either side means unset: AR2 with no secret trusts
      # nobody, and the refusal it returns is a deliberate 404 that looks
      # exactly like a missing artifact. That cost an afternoon on 2026-09-03.
      AR2_INTERNAL_SHARED_SECRET: ${AR2_INTERNAL_SHARED_SECRET:-demo-internal-secret-not-for-production}
    ports:
      - "8001:8001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  terrapipe-os:
    profiles: ["openscience"]
    build:
      context: ../../terrapipe-os
      dockerfile: Dockerfile
    environment:
      # The node resolves GeoIDs against the AR2 node and verifies callers
      # against the hub's JWKS. It holds no Pancake or vendor secret.
      AR2_NODE_URL: ${AR2_NODE_URL:-http://node:8001}
      AR2_HUB_URL: ${HUB_URL:-http://hub:8000}
      HUB_JWKS_URL: ${HUB_JWKS_URL:-http://hub:8000/.well-known/jwks.json}
      # Client credentials for the node's own calls to AR2. Optional: without
      # them the node can still answer for GeoIDs that need no authentication.
      TERRAPIPE_OS_CLIENT_ID: ${TERRAPIPE_OS_CLIENT_ID:-}
      TERRAPIPE_OS_CLIENT_SECRET: ${TERRAPIPE_OS_CLIENT_SECRET:-}
      # Publishing is off unless an issuer for layer-publish credentials is
      # named, so a demo node cannot have layers pushed into it by accident.
      PUBLISH_JWKS_URL: ${PUBLISH_JWKS_URL:-}
    volumes:
      # Read-only: a node that can write to the mirror can quietly disagree
      # with the publisher. Defaults point at empty local directories so the
      # profile comes up on a laptop with no share mounted.
      - ${TERRAPIPE_SHARE:-./share}:/share:ro
      - ${TERRAPIPE_NETWORK:-./network}:/network:ro
    ports:
      - "8200:8200"
    healthcheck:
      # /health is open by design and reports which mirrors are actually
      # mounted, so an empty share is visible here rather than as a puzzling
      # 503 on the first screen.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8200/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  terrapipe-os-mcp:
    # The same handlers as the HTTP node, over MCP, so an agent can ask the
    # questions a person asks through /screen and /data. A separate service
    # rather than a second port on the one above because the two surfaces
    # authenticate differently and should be able to fail independently: this
    # one advertises itself as an OAuth resource and verifies every caller's
    # hub token against TERRAPIPE_OS_MCP_URL.
    profiles: ["openscience"]
    build:
      context: ../../terrapipe-os
      dockerfile: Dockerfile
    command: ["terrapipe-os-mcp", "--transport", "streamable-http", "--port", "8201"]
    environment:
      AR2_NODE_URL: ${AR2_NODE_URL:-http://node:8001}
      AR2_HUB_URL: ${HUB_URL:-http://hub:8000}
      HUB_JWKS_URL: ${HUB_JWKS_URL:-http://hub:8000/.well-known/jwks.json}
      TERRAPIPE_OS_CLIENT_ID: ${TERRAPIPE_OS_CLIENT_ID:-}
      TERRAPIPE_OS_CLIENT_SECRET: ${TERRAPIPE_OS_CLIENT_SECRET:-}
      # The URL clients reach this server at, which is also the resource an
      # agent's token has to be issued for. The server refuses to start over
      # HTTP without it rather than serving unauthenticated.
      TERRAPIPE_OS_MCP_URL: ${TERRAPIPE_OS_MCP_URL:-http://localhost:8201/mcp}
    volumes:
      - ${TERRAPIPE_SHARE:-./share}:/share:ro
      - ${TERRAPIPE_NETWORK:-./network}:/network:ro
    ports:
      - "8201:8201"

  pancake-grants:
    profiles: ["core"]
    build:
      context: ../services
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pancake:${POSTGRES_PASSWORD:-pancake-dev-only}@postgres:5432/pancake
      PANCAKE_ISSUER_KEY: ${PANCAKE_ISSUER_KEY:?set PANCAKE_ISSUER_KEY (make keys)}
      PANCAKE_ISSUER_ID: ${PANCAKE_ISSUER_ID:-did:web:pancake.local}
      HUB_JWKS_URL: ${HUB_JWKS_URL:-http://hub:8000/.well-known/jwks.json}
      HUB_URL: ${HUB_URL:-http://hub:8000}
      STATUS_LIST_URI: ${STATUS_LIST_URI:-http://pancake-grants:8100/grants/status-list}
      PANCAKE_REQUIRE_GRANT_FOR_WEATHER: ${PANCAKE_REQUIRE_GRANT_FOR_WEATHER:-false}
      AR2_NODE_URL: ${AR2_NODE_URL:-http://node:8001}
      # The same value as on the node above; see the note there.
      AR2_INTERNAL_SHARED_SECRET: ${AR2_INTERNAL_SHARED_SECRET:-demo-internal-secret-not-for-production}
    ports:
      - "8100:8100"

  pancake-tap:
    profiles: ["core"]
    build:
      context: ../services
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://pancake:${POSTGRES_PASSWORD:-pancake-dev-only}@postgres:5432/pancake
      TAP_VENDORS_CONFIG: /app/dpi-demo/tap_vendors.yaml
      TERRAPIPE_BASE_URL: ${TERRAPIPE_BASE_URL:-https://appserver.terrapipe.io}
      TERRAPIPE_SECRET: ${TERRAPIPE_SECRET:-}
      TERRAPIPE_CLIENT: ${TERRAPIPE_CLIENT:-}
      TERRAPIPE_EMAIL: ${TERRAPIPE_EMAIL:-}
      TERRAPIPE_PASSWORD: ${TERRAPIPE_PASSWORD:-}
      # Open-science node. Unset means the three terrapipe-os vendors are
      # skipped and the demo keeps its offline path, so `--profile core` alone
      # still runs. Set it (the openscience profile publishes the name below)
      # and the deforestation, NDVI and forecast vendors light up.
      TERRAPIPE_OS_URL: ${TERRAPIPE_OS_URL:-}
      TERRAPIPE_OS_CLIENT_ID: ${TERRAPIPE_OS_CLIENT_ID:-}
      TERRAPIPE_OS_CLIENT_SECRET: ${TERRAPIPE_OS_CLIENT_SECRET:-}
      HUB_URL: ${HUB_URL:-http://hub:8000}
    volumes:
      - ./tap_vendors.yaml:/app/dpi-demo/tap_vendors.yaml:ro
    command: ["python", "-m", "pancake_services.tap.worker", "--config", "/app/dpi-demo/tap_vendors.yaml"]

  pnd:
    profiles: ["core"]
    build:
      context: ../../opensource-pestmodels
      dockerfile: docker/Dockerfile
    depends_on:
      - pancake-grants
    environment:
      PND_WEATHER_PROVIDER: ${PND_WEATHER_PROVIDER:-dpi}
      PND_PANCAKE_URL: ${PND_PANCAKE_URL:-http://pancake-grants:8100}
      PND_AGSTACK_REGISTRY_URL: ${PND_AGSTACK_REGISTRY_URL:-http://node:8001}
      PND_NOAA_API_TOKEN: ${PND_NOAA_API_TOKEN:-}
    ports:
      - "8080:8000"

volumes:
  pnd_demo_pgdata:
