name: Pancake CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements.txt



      - name: FATFD integrity validator
        run: python .audit/validate_fatfd.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements.txt

      - name: Legacy + regression tests
        run: python -m pytest tests -q

      - name: Lint with ruff
        run: |
          pip install ruff==0.6.9
          ruff check services/pancake_services services/tests

      - name: Checkout AR2
        uses: actions/checkout@v4
        with:
          repository: agstack/ar2
          ref: main
          path: ar2
          token: ${{ secrets.AGSTACK_PAT }}

      - name: Checkout terrapipe-os
        uses: actions/checkout@v4
        with:
          repository: sumerjohal/terrapipe-os
          ref: main
          path: terrapipe-os
          token: ${{ secrets.AGSTACK_PAT }}

      - name: Checkout ar2-hub
        uses: actions/checkout@v4
        with:
          repository: agstack/ar2-hub
          ref: main
          path: ar2-hub
          token: ${{ secrets.AGSTACK_PAT }}

      # The tests look for sibling repositories beside this one, and for a
      # pancake checkout reachable from home -- the layout the READMEs tell a
      # developer to create. actions/checkout cannot write outside the
      # workspace, so the layout is assembled here instead of being assumed.
      # Without this, fourteen cross-layer tests skip and the compose build
      # context does not exist, which is how this job stayed red from 7 Sep.
      - name: Lay the checkouts out the way the tests expect
        run: |
          mv ar2 ar2-hub terrapipe-os ..
          ln -s "$GITHUB_WORKSPACE" "$HOME/pancake"

      - name: Services test suite
        run: |
          pip install -r ../ar2/requirements.txt
          pip install -e ../terrapipe-os
          # The suite runs subprocesses -- the notebook's import guard is tested
          # by importing it in a fresh interpreter -- and those do not inherit
          # pytest's path juggling.
          pip install -e services
          # What the notebook tests import. Without folium's branca, seven
          # assertions about the AR2 notebook fail on the import rather than on
          # anything they are about.
          pip install folium plotly
          python -m pytest services/tests -q -ra --strict-markers --cov=services/pancake_services --cov-report=term

      - name: Test-issuer kit smoke
        working-directory: services
        run: python -m pancake_services.grants.testkit.mint_test_credentials

      - name: End-to-end demo
        working-directory: services
        run: python demo/end_to_end_demo.py
