name: Pancake CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements.txt



      - name: FATFD integrity validator
        run: python .audit/validate_fatfd.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/requirements.txt

      - name: Legacy + regression tests
        run: python -m pytest tests -q

      - name: Lint with ruff
        run: |
          pip install ruff==0.6.9
          ruff check services/pancake_services services/tests

      - name: Checkout AR2
        uses: actions/checkout@v4
        with:
          repository: agstack/ar2
          ref: main
          path: ar2
          token: ${{ secrets.AGSTACK_PAT }}

      # The connector's contract test skips itself when terrapipe-os is absent,
      # and the suite turns that skip into an error rather than let a test that
      # never ran report the same green as one that did. Without this step the
      # job fails on exactly that, which is what it did from 7 Sep to 15 Sep.
      - name: Checkout terrapipe-os
        uses: actions/checkout@v4
        with:
          # The node lives under sumerjohal, not agstack; naming agstack here
          # cost a run.
          repository: sumerjohal/terrapipe-os
          ref: main
          path: terrapipe-os
          token: ${{ secrets.AGSTACK_PAT }}

      - name: Services test suite
        env:
          # actions/checkout cannot place a repo outside the workspace, and the
          # contract test looks beside it by default.
          TERRAPIPE_OS_DIR: ${{ github.workspace }}/terrapipe-os
        run: |
          pip install -r ar2/requirements.txt
          pip install -e terrapipe-os
          # What the notebook tests import. Without folium's branca, seven
          # assertions about the AR2 notebook fail on the import rather than on
          # anything they are about.
          pip install folium plotly
          python -m pytest services/tests -q -ra --strict-markers --cov=services/pancake_services --cov-report=term

      - name: Test-issuer kit smoke
        working-directory: services
        run: python -m pancake_services.grants.testkit.mint_test_credentials

      - name: End-to-end demo
        working-directory: services
        run: python demo/end_to_end_demo.py
